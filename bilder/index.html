<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bilder · Liza & Albin</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Ladda upp era bilder från bröllopsdagen." />
  <meta name="robots" content="noindex" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="sv_SE" />
  <meta property="og:url" content="https://lizaochalbin.se/bilder/" />
  <meta property="og:title" content="Bilder · Liza & Albin" />
  <meta property="og:description" content="Ladda upp era bilder från bröllopsdagen." />
  <meta property="og:image" content="https://lizaochalbin.se/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Liza och Albin" />

  <link rel="canonical" href="https://lizaochalbin.se/bilder/" />

  <!-- Samma typsnitt som övriga sidor, men laddade utan att blockera renderingen.
       style.css har systemtypsnitt som fallback tills de har laddat. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="../style.css?v=4" />
  <style>
    /* Widgeten är sidan: en smal rad överst, sedan fyller den resten av skärmen.
       Sidan själv skrollar inte, bara widgeten. */
    html, body { height: 100%; overflow: hidden; }
    body { min-height: 0; padding: 0 12px; }
    main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 14px 0 max(12px, env(safe-area-inset-bottom));
    }
    .photos-bar {
      flex: none;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      gap: 12px;
      padding: 0 4px;
    }
    .photos-bar .back-link { margin: 0; justify-self: start; white-space: nowrap; }
    .photos-bar .page-title { font-size: 30px; white-space: nowrap; }
    .photos-bar .upload-fallback {
      grid-column: 1 / -1;
      margin: 2px 0 0;
      font-size: 14px;
      text-align: center;
    }
    .upload {
      flex: 1;
      min-height: 0;
      margin-top: 12px;
    }
    #wedibox-embed { height: 100%; }
    /* Widgeten sätter höjd som inline-stil, därav !important. */
    #wedibox-embed iframe {
      height: 100% !important;
      min-height: 0 !important;
      max-height: 100% !important;
    }
  </style>
</head>
<body>
  <main>
    <!-- Smal rad överst: tillbaka, rubrik och reservlänk -->
    <header class="photos-bar reveal reveal-1">
      <a class="back-link" href="/">← Tillbaka</a>
      <h1 class="page-title">Era <span class="amp">bilder</span></h1>
      <p class="upload-fallback">Fungerar det inte? <a href="https://www.wedibox.com/w/photo-collection/recpb7QIzetqmmL6">Ladda upp här i stället</a></p>
    </header>

    <!-- UPPLADDNING -->
    <!-- Ingen .reveal här: widgeten kan öppna fixed-positionerade lager,
         som inte får hamna under en transform. -->
    <section class="upload" aria-label="Ladda upp bilder">
      <!-- Wedibox Photo Collection -->
      <div id="wedibox-embed" data-event="efb20f94-ae89-4a88-bf31-57d25b1299c8"></div>
      <script src="https://embed.wedibox.com/widget.js" async></script>
    </section>
  </main>
</body>
</html>
